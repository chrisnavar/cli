---
name: docs-build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  merge_group: ~

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    uses: elastic/docs-actions/.github/workflows/docs-build.yml@e9cc8a02418ec86036ebe5a220f9c3a4a80aaa1d # v1
    with:
      enable-vale-linting: true
